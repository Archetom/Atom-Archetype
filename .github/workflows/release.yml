name: Release to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact non-SNAPSHOT version from pom.xml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maven-central-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: maven-central

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java, Maven Central, and GPG
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          check-latest: true
          cache: maven
          cache-dependency-path: |
            .mvn/wrapper/maven-wrapper.properties
            pom.xml
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify release coordinates and repository state
        shell: bash
        run: |
          version="$(awk -F'[<>]' '/^[[:space:]]*<version>/{print $3; exit}' pom.xml)"
          test "$version" = "${{ inputs.version }}"
          case "$version" in
            *-SNAPSHOT) echo "Refusing to publish a SNAPSHOT as a release."; exit 1 ;;
          esac
          git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD -- .
          artifact_url="https://repo.maven.apache.org/maven2/io/github/archetom/atom-archetype/${version}/atom-archetype-${version}.pom"
          if curl --fail --silent --show-error --head "$artifact_url" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing Maven Central release: $artifact_url"
            exit 1
          fi

      - name: Publish and wait for Maven Central
        timeout-minutes: 40
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >-
          ./mvnw -B -ntp clean deploy
          -Dcentral.autoPublish=true
          -Dcentral.waitUntil=published

      - name: Verify release is publicly resolvable
        timeout-minutes: 15
        shell: bash
        run: |
          local_repository="${RUNNER_TEMP}/release-verification-repository"
          remote_repository="central::default::https://repo.maven.apache.org/maven2"
          for attempt in {1..30}; do
            if ./mvnw -B -U -ntp dependency:get \
              -Dmaven.repo.local="$local_repository" \
              -Dartifact="io.github.archetom:atom-archetype:${{ inputs.version }}" \
              -Dtransitive=false \
              -DremoteRepositories="$remote_repository"; then
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Release did not become publicly resolvable in time."
              exit 1
            fi
            sleep 20
          done
