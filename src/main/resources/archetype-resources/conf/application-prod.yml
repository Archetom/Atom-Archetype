#set( $dollar = '$' )
######################## production environment ####################
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${dollar}{SPRING_DATASOURCE_URL}
    username: ${dollar}{SPRING_DATASOURCE_USERNAME}
    password: ${dollar}{SPRING_DATASOURCE_PASSWORD}

# API documentation is opt-in in production.
springdoc:
  api-docs:
    enabled: ${dollar}{SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${dollar}{SPRINGDOC_SWAGGER_UI_ENABLED:false}

# Bearer JWT authentication for HTTP and gRPC comes from Spring Boot's resource-server settings,
# for example SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI. Without them every API request returns 401.
# Production never trusts caller-controlled identity headers.
atom:
  security:
    trusted-header:
      enabled: false
      authorities: ""
  redis:
    enabled: ${dollar}{ATOM_REDIS_ENABLED:false}
