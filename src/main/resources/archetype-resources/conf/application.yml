#set( $dollar = '$' )
spring:
  application:
    name: ${rootArtifactId}
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  task:
    execution:
      # Runs @Async work such as application event listeners.
      thread-name-prefix: ${rootArtifactId}-task-
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 100
        keep-alive: 60s
      shutdown:
        # Let in-flight post-commit work finish during graceful shutdown.
        await-termination: true
        await-termination-period: 30s
  grpc:
    server:
      # gRPC is opt-in through atom.grpc.enabled. Enabling it also requires a JWT decoder,
      # for example spring.security.oauth2.resourceserver.jwt.issuer-uri.
      enabled: ${dollar}{atom.grpc.enabled:false}

logging:
  file:
    # Directory for the rolling files written by logback-spring.xml.
    path: ./logs/app

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  mapper-locations: classpath*:mapper/**/*.xml

atom:
  api:
    version: ${version}
  security:
    password:
      # BCrypt is the replaceable baseline adapter; tune only after measuring authentication capacity.
      bcrypt-strength: 12
    trusted-header:
      enabled: false
      authorities: ""
  redis:
    enabled: false
  grpc:
    enabled: false

management:
  health:
    # Do not create a failing Redis health dependency while the optional adapter is disabled.
    redis:
      enabled: ${dollar}{atom.redis.enabled:false}
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
    tags:
      application: ${rootArtifactId}
  prometheus:
    metrics:
      export:
        enabled: false
